{% set name = "xeofs" %}
{% set version = "3.0.6" %}
{% set python_min = "3.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/xeofs-{{ version }}.tar.gz
  sha256: 397844fac117d1910bab4004d3d174d2a5f3ce5f4873ec90ef399af609bc3a00

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - numpy >=1.24
    - pandas >=2.0.0
    - xarray >=2024.10.0
    - scikit-learn >=1.0.2
    - tqdm >=4.64.0
    - dask >=2023.0.1
    - typing-extensions >=4.8
  run_constrained:
    - numba >=0.57
    - statsmodels >=0.14.0
    - h5netcdf >=1.0.0
    - netcdf4 >=1.5.8
    - zarr >=2.14.0

test:
  imports:
    - xeofs
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/nicrie/xeofs
  summary: Collection of EOF analysis and related techniques for climate science
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - nicrie
